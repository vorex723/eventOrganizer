spring.datasource.url=${APP_DB_URL}
spring.datasource.username=${APP_DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

spring.mail.host=${APP_MAIL_HOST}
spring.mail.port=${APP_MAIL_PORT:587}
spring.mail.username=${APP_MAIL_USERNAME}
spring.mail.password=${APP_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${APP_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${APP_MAIL_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${APP_MAIL_WRITE_TIMEOUT:10000}

app.mail.activation-base-url=${APP_MAIL_ACTIVATION_BASE_URL}
app.mail.password-reset-base-url=${APP_MAIL_PASSWORD_RESET_BASE_URL}
app.mail.email-change-base-url=${APP_MAIL_EMAIL_CHANGE_BASE_URL}
app.mail.from-address=${APP_MAIL_FROM_ADDRESS}

app.auth.activation-result-base-url=${APP_AUTH_ACTIVATION_RESULT_BASE_URL}
app.auth.email-change-result-base-url=${APP_AUTH_EMAIL_CHANGE_RESULT_BASE_URL}

app.firebase.enabled=${APP_FIREBASE_ENABLED:false}
app.firebase.service-account-location=${APP_FIREBASE_SERVICE_ACCOUNT_LOCATION:}

app.frontend.url=${APP_FRONTEND_URL:}
app.api.cors.allowed-origins=${APP_API_CORS_ALLOWED_ORIGINS:}
