spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.servlet.multipart.max-file-size=${app.community.max-file-size}
spring.servlet.multipart.max-request-size=${app.community.max-file-size}

app.jwt.access-expiration=1800000
app.jwt.refresh-short-expiration=86400000
app.jwt.refresh-long-expiration=2592000000
app.jwt.secret=${APP_JWT_SECRET}

app.auth.activation-token-expiration=345600000
app.auth.activation-result-base-url=${app.frontend.url}/activation-result
app.auth.password-reset-token-expiration=3600000
app.auth.email-change-token-expiration=86400000
app.auth.email-change-result-base-url=${app.frontend.url}/email-change-result
app.auth.email.worker-enabled=${APP_AUTH_EMAIL_WORKER_ENABLED:true}
app.auth.email.poll-delay=${APP_AUTH_EMAIL_POLL_DELAY:5s}
app.auth.email.batch-size=${APP_AUTH_EMAIL_BATCH_SIZE:100}
app.auth.email.max-attempts=${APP_AUTH_EMAIL_MAX_ATTEMPTS:6}
app.auth.email.retry-delays=${APP_AUTH_EMAIL_RETRY_DELAYS:1m,5m,15m,30m,60m}
app.auth.email.processing-timeout=${APP_AUTH_EMAIL_PROCESSING_TIMEOUT:10m}
app.auth.email.resend-cooldown=${APP_AUTH_EMAIL_RESEND_COOLDOWN:1m}
app.auth.email.cleanup-enabled=${APP_AUTH_EMAIL_CLEANUP_ENABLED:true}
app.auth.email.retention=${APP_AUTH_EMAIL_RETENTION:90d}
app.auth.email.cleanup-cron=${APP_AUTH_EMAIL_CLEANUP_CRON:0 30 3 * * *}
app.auth.rate-limit.enabled=true
app.auth.rate-limit.trust-forwarded-headers=false
app.auth.rate-limit.key-secret=${APP_AUTH_RATE_LIMIT_KEY_SECRET:${APP_ENCRYPTION_PASSWORD}}
app.auth.rate-limit.registration-max-requests=5
app.auth.rate-limit.registration-window=1m
app.auth.rate-limit.login-max-requests=10
app.auth.rate-limit.login-window=1m

app.encryption.password=${APP_ENCRYPTION_PASSWORD}
app.encryption.salt=${APP_ENCRYPTION_SALT}
# Keep retired message keys configured until every message encrypted with them is no longer retained.
# For rotation, set app.encryption.message-active-key-id and
# app.encryption.message-keys.<key-id>.password/salt before deploying the new active key.
app.encryption.message-active-key-id=default

app.mail.activation-base-url=http://localhost:8080/api/v1/auth/activate/
app.mail.password-reset-base-url=${app.frontend.url}/reset-password?token=
app.mail.email-change-base-url=http://localhost:8080/api/v1/auth/change-email/
app.mail.from-address=no-reply@eventorganizer.local

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

app.seed.local-data-enabled=false

app.firebase.enabled=false

app.frontend.url=https://localhost:5173

app.notifications.delivery.worker-enabled=${APP_NOTIFICATIONS_DELIVERY_WORKER_ENABLED:true}
app.notifications.delivery.poll-delay=${APP_NOTIFICATIONS_DELIVERY_POLL_DELAY:5s}
app.notifications.delivery.batch-size=${APP_NOTIFICATIONS_DELIVERY_BATCH_SIZE:100}
app.notifications.delivery.max-attempts=${APP_NOTIFICATIONS_DELIVERY_MAX_ATTEMPTS:6}
app.notifications.delivery.retry-delays=${APP_NOTIFICATIONS_DELIVERY_RETRY_DELAYS:1m,5m,15m,30m,60m}
app.notifications.delivery.processing-timeout=${APP_NOTIFICATIONS_DELIVERY_PROCESSING_TIMEOUT:10m}
app.notifications.devices.cleanup-enabled=${APP_NOTIFICATIONS_DEVICES_CLEANUP_ENABLED:true}
app.notifications.devices.stale-after=${APP_NOTIFICATIONS_DEVICES_STALE_AFTER:90d}
app.notifications.devices.cleanup-cron=${APP_NOTIFICATIONS_DEVICES_CLEANUP_CRON:0 0 3 * * *}
app.notifications.email.enabled=${APP_NOTIFICATIONS_EMAIL_ENABLED:false}
app.notifications.retention.cleanup-enabled=${APP_NOTIFICATIONS_RETENTION_CLEANUP_ENABLED:true}
app.notifications.retention.completed-for=${APP_NOTIFICATIONS_RETENTION_COMPLETED_FOR:90d}
app.notifications.retention.dead-for=${APP_NOTIFICATIONS_RETENTION_DEAD_FOR:180d}
app.notifications.retention.cleanup-cron=${APP_NOTIFICATIONS_RETENTION_CLEANUP_CRON:0 15 3 * * *}
app.notifications.retention.backlog-alert-threshold=${APP_NOTIFICATIONS_RETENTION_BACKLOG_ALERT_THRESHOLD:1000}

app.pagination.default-page-size=20
app.community.max-tags-per-event=10
app.community.max-files-per-event=50
app.community.max-file-size=10MB
app.community.max-event-file-storage=500MB
app.community.max-display-filename-length=120
app.community.max-attendees=1000
app.community.max-archive-entries=1000
app.community.max-archive-uncompressed-size=50MB
app.community.max-archive-compression-ratio=100
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
