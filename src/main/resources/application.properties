spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.access-expiration=1800000
app.jwt.refresh-short-expiration=86400000
app.jwt.refresh-long-expiration=2592000000
app.jwt.secret=${APP_JWT_SECRET}

app.auth.activation-token-expiration=345600000
app.auth.password-reset-token-expiration=3600000
app.auth.email-change-token-expiration=86400000
app.auth.email-change-result-base-url=https://localhost:5173/email-change-result
app.auth.email.worker-enabled=true
app.auth.email.poll-delay=5s
app.auth.email.batch-size=100
app.auth.email.max-attempts=6
app.auth.email.retry-delays=1m,5m,15m,30m,60m
app.auth.email.processing-timeout=10m
app.auth.email.resend-cooldown=1m
app.auth.email.cleanup-enabled=true
app.auth.email.retention=90d
app.auth.email.cleanup-cron=0 30 3 * * *
app.auth.rate-limit.enabled=true
app.auth.rate-limit.trust-forwarded-headers=false
app.auth.rate-limit.key-secret=${APP_AUTH_RATE_LIMIT_KEY_SECRET:${APP_ENCRYPTION_PASSWORD}}
app.auth.rate-limit.registration-max-requests=5
app.auth.rate-limit.registration-window=1m
app.auth.rate-limit.login-max-requests=10
app.auth.rate-limit.login-window=1m

app.encryption.password=${APP_ENCRYPTION_PASSWORD}
app.encryption.salt=${APP_ENCRYPTION_SALT}

app.mail.activation-base-url=http://localhost:8080/api/v1/auth/activate/
app.mail.password-reset-base-url=https://localhost:5173/reset-password?token=
app.mail.email-change-base-url=http://localhost:8080/api/v1/auth/change-email/
app.mail.from-address=no-reply@eventorganizer.local

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

app.seed.local-data-enabled=false

app.firebase.enabled=false
app.firebase.service-account-location=

app.frontend.url=https://localhost:5173

app.notifications.delivery.worker-enabled=true
app.notifications.delivery.poll-delay=5s
app.notifications.delivery.batch-size=100
app.notifications.delivery.max-attempts=6
app.notifications.delivery.retry-delays=1m,5m,15m,30m,60m
app.notifications.delivery.processing-timeout=10m
app.notifications.devices.cleanup-enabled=true
app.notifications.devices.stale-after=90d
app.notifications.devices.cleanup-cron=0 0 3 * * *
app.notifications.email.enabled=false

app.pagination.default-page-size=20
app.community.max-tags-per-event=10
app.community.max-files-per-event=50
app.community.max-file-size=10MB
app.community.max-event-file-storage=500MB
app.community.max-display-filename-length=120
app.community.max-attendees=1000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
